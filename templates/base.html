<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} | {% elif section.title %}{{ section.title }} | {% endif %}Draft.</title>
    <style>
        body {
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            padding: 4px;
            vertical-align: top;
        }
        img[width="800"], td img, .crop img {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            display: block;
        }
        .crop {
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
        }
        img[width="20"] {
            display: inline-block;
            vertical-align: middle;
        }
        .no-crop img, .no-crop img[width="800"] {
            aspect-ratio: auto !important;
            object-fit: unset !important;
            height: auto !important;
        }
    </style>
    {% block extra_head %}{% endblock extra_head %}
</head>

<body>
<div class="container">

{% block topbar %}
<nav>

</nav>
<hr>
{% endblock topbar %}

{% block content %} {% endblock content %}

{% block footer %}

</footer>
{% endblock footer %}

</div>
</body>

</html>
