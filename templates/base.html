<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} | {% elif section.title %}{{ section.title }} | {% endif %}Draft.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 18px;
            line-height: 1.4;
            color: #444444;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        h1, h2, h3, h4, h5, h6 {
            line-height: 1.2;
            letter-spacing: -0.02em;
        }
        h1 {
            font-size: 2em;
            margin-top: 0.8em;
            margin-bottom: 0.4em;
        }
        h2 {
            font-size: 1.55em;
            margin-top: 1.3em;
            margin-bottom: 0.4em;
        }
        h3 {
            font-size: 1.25em;
            margin-top: 1.2em;
            margin-bottom: 0.4em;
        }
        h4 {
            font-size: 1.1em;
            margin-top: 1.1em;
            margin-bottom: 0.3em;
        }
        h5 {
            font-size: 1em;
            margin-top: 1em;
            margin-bottom: 0.3em;
        }
        h6 {
            font-size: 0.9em;
            margin-top: 1em;
            margin-bottom: 0.3em;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            padding: 4px;
            vertical-align: top;
        }
        img[width="800"], td img, .crop img {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            display: block;
        }
        .crop {
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
        }
        img[width="20"] {
            display: inline-block;
            vertical-align: middle;
        }
        .no-crop img, .no-crop img[width="800"] {
            aspect-ratio: auto !important;
            object-fit: unset !important;
            height: auto !important;
        }
    </style>
    {% block extra_head %}{% endblock extra_head %}
</head>

<body>
<div class="container">

{% block topbar %}
<nav>
    <a href="{{ get_url(path='') }}"> &lt;3</a> |
    <a href="{{ get_url(path='') }}">Experiments</a> |
    <!-- <a href="{{ get_url(path='') }}">Work</a> | -->
    <a href="{{ get_url(path='@/about/_index.md') }}">About</a> |
    <a href="https://github.com/maniack431" target="_blank">GitHub</a> |
    <a href="mailto:sahib.s1923@gmail.com">Email</a> |
    <a href="https://instagram.com/ghaint_sahib" target="_blank">Instagram</a> |
    <a href="https://docs.google.com/spreadsheets/d/1UzEVq241YTO7lEOQzpYqo9u6tBIK96_SuvvjLsdPJi4/edit?usp=sharing" target="_blank">Repository</a>
</nav>
<hr>
{% endblock topbar %}

{% block content %} {% endblock content %}

{% block footer %}
<hr>
<footer>
    <p style="text-align: right;">sahib &lt;3</p>
</footer>
{% endblock footer %}

</div>
</body>

</html>
