<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>{% if page.title %}{{ page.title }} | {% elif section.title %}{{ section.title }} | {% endif %}Draft.</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ get_url(path='main.css', cachebust=true) }}" />
    <script>
        // Check for saved theme preference or use OS default
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</head>

{% block topbar %}
<header class="topbar">
    <div class="container topbar__inner">
        <div class="topbar-left" style="display: flex; align-items: center; gap: 2rem;">
            <a href="{{ get_url(path='') }}" class="nav-link logo-link">draft.</a>
            <a href="{{ get_url(path='@/work/_index.md') }}" class="nav-link">Work</a>
            <a href="{{ get_url(path='@/about/_index.md') }}" class="nav-link">About</a>
            <a href="#" id="theme-toggle" class="nav-link" aria-label="Toggle Theme" style="font-size: 1.1rem;"><i
                    class="fas fa-moon"></i></a>
        </div>

        <div class="topbar-right" style="display: flex; gap: 1.5rem; font-size: 1.2rem; align-items: center;">
            <a href="https://github.com/maniack431" target="_blank" class="nav-link" aria-label="GitHub"><i
                    class="fab fa-github"></i></a>
            <a href="mailto:sahib.s1923@gmail.com" class="nav-link" aria-label="Email"><i
                    class="fas fa-envelope"></i></a>
            <a href="https://instagram.com/ghaint_sahib" target="_blank" class="nav-link" aria-label="Instagram"><i
                    class="fab fa-instagram"></i></a>
        </div>
    </div>
</header>
{% endblock topbar %}

<body>
    <section class="section">
        <div class="container">
            {% block content %} {% endblock content %}
        </div>
    </section>

    <!-- Image Modal -->
    <div id="imageModal" class="image-modal">
        <span class="modal-close">&times;</span>
        <span class="modal-nav modal-prev">&lt;</span>
        <div class="modal-content">
            <img id="modalImage" class="modal-image" src="" alt="">
        </div>
        <span class="modal-nav modal-next">&gt;</span>
    </div>

    <script>
        let currentImageIndex = -1;
        let images = [];

        // Initialize gallery
        function initGallery() {
            images = Array.from(document.querySelectorAll('.gallery-item img'));
        }

        // Open modal with image
        function openModal(index) {
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');

            if (index >= 0 && index < images.length) {
                currentImageIndex = index;
                modalImage.src = images[index].src;
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        }

        // Close modal
        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
            currentImageIndex = -1;
        }

        // Navigate to next image
        function nextImage() {
            if (images.length > 0) {
                currentImageIndex = (currentImageIndex + 1) % images.length;
                document.getElementById('modalImage').src = images[currentImageIndex].src;
            }
        }

        // Navigate to previous image
        function prevImage() {
            if (images.length > 0) {
                currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
                document.getElementById('modalImage').src = images[currentImageIndex].src;
            }
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', function () {
            initGallery();

            // Click on gallery images
            images.forEach((img, index) => {
                img.parentElement.addEventListener('click', function () {
                    openModal(index);
                });
            });

            // Close button
            document.querySelector('.modal-close').addEventListener('click', closeModal);

            // Navigation buttons
            document.querySelector('.modal-prev').addEventListener('click', prevImage);
            document.querySelector('.modal-next').addEventListener('click', nextImage);

            // Close on background click
            document.getElementById('imageModal').addEventListener('click', function (e) {
                if (e.target === this) {
                    closeModal();
                }
            });

            // Keyboard controls
            document.addEventListener('keydown', function (e) {
                const modal = document.getElementById('imageModal');
                if (modal.classList.contains('active')) {
                    if (e.key === 'ArrowRight') nextImage();
                    if (e.key === 'ArrowLeft') prevImage();
                    if (e.key === 'Escape') closeModal();
                }
            });
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('theme-toggle');
            const icon = themeToggle.querySelector('i');

            // Set initial icon based on current theme
            if (document.documentElement.getAttribute('data-theme') === 'dark') {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            }

            themeToggle.addEventListener('click', (e) => {
                e.preventDefault();
                const html = document.documentElement;
                const isDark = html.getAttribute('data-theme') === 'dark';

                if (isDark) {
                    html.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'light');
                    icon.classList.remove('fa-sun');
                    icon.classList.add('fa-moon');
                } else {
                    html.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                    icon.classList.remove('fa-moon');
                    icon.classList.add('fa-sun');
                }
            });
        });
    </script>
</body>

</html>
